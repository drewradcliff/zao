name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check config/VERSION matches the tag
        run: |
          if [ "v$(cat config/VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "::error::config/VERSION is $(cat config/VERSION), but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

      # TAP_DEPLOY_KEY is a deploy key with write access to the tap repo.
      - uses: actions/checkout@v7
        with:
          repository: drewradcliff/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Point the Homebrew formula at this release
        working-directory: tap
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          sha256="$(curl -fsSL --retry 3 "$url" | sha256sum | cut -d ' ' -f 1)"
          sed -i -E \
            -e "s|^  url \".*\"$|  url \"$url\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha256\"|" \
            Formula/zao.rb
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "zao ${GITHUB_REF_NAME#v}"
          git push
